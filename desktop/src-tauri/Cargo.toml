[package]
name = "evertally-desktop"
version = "0.2.0"
edition = "2024"
description = "Evertally desktop app: the website and your addon data in one window, with automatic sync."

[lib]
name = "evertally_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
evertally-sync = { path = "../../sync", default-features = false }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
open = "5.4.5"
ureq = "3.5.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
