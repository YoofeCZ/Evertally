[package]
name = "evertally-desktop"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Evertally native desktop companion and offline WoW journal"

[[bin]]
name = "Evertally"
path = "src/main.rs"

[[bin]]
name = "EvertallyBackground"
path = "src/background.rs"

[dependencies]
evertally-sync = { path = "../../sync", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

