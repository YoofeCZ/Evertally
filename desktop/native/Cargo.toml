[package]
name = "evertally-desktop"
version = "0.9.20"
edition = "2024"
rust-version = "1.95"
description = "Evertally background bridge between WoW and the website"
autobins = false

[[bin]]
name = "Evertally"
path = "src/bridge_main.rs"

[[bin]]
name = "EvertallyBackground"
path = "src/background.rs"

[dependencies]
evertally-sync = { path = "../../sync" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

# Linux windowing back ends (the common eframe features above leave them off).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

