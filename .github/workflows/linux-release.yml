name: Evertally Bridge Linux

# Builds the Linux package of the bridge (sync/ + desktop/native/) and attaches it to the GitHub release of the same version
# (bridge-<version>). Started by pushing a tag "linux-bridge-*" or by hand. Failures become annotations (.github/ci-run.sh).
on:
  push:
    tags: ["linux-bridge-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (tray icon, windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sync
            desktop/native
      - name: Package
        run: bash .github/ci-run.sh ./Build-Release.sh
      - name: Tests (a failure is reported, the package is kept)
        continue-on-error: true
        run: |
          (cd sync && bash ../.github/ci-run.sh cargo test --lib)
          (cd desktop/native && bash ../../.github/ci-run.sh cargo test)
      - uses: actions/upload-artifact@v4
        with:
          name: evertally-bridge-Linux
          path: releases/Evertally-*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/native/Cargo.toml | head -1)
          if gh release view "bridge-$version" >/dev/null 2>&1; then
            gh release upload "bridge-$version" releases/Evertally-* --clobber
          else
            gh release create "bridge-$version" releases/Evertally-* --title "Evertally Bridge $version (Linux)" --notes "Linux package built by GitHub Actions."
          fi
