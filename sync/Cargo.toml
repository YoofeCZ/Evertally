[package]
name = "evertally-sync"
version = "0.8.1"
edition = "2024"

[features]
# The legacy tray app; the native desktop window uses the library without it.
default = ["tray"]
tray = ["dep:tao", "dep:tray-icon"]

[[bin]]
name = "evertally-sync"
path = "src/main.rs"
required-features = ["tray"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
gethostname = "1.1.0"
keyring = "4.2.0"
notify = "8.2.2"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tao = { version = "0.37.2", optional = true }
thiserror = "2.0.21"
tray-icon = { version = "0.26.1", optional = true }
ureq = { version = "3.5.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
winreg = "0.56.0"

# Linux and macOS: list processes to find the Forever client (also under Wine / CrossOver).
[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
libc = "0.2"

# macOS: read the addon marker pixels from the game window.
[target.'cfg(target_os = "macos")'.dependencies]
xcap = { version = "0.9.10", default-features = false }

# Linux: the same through the X11 protocol (pure Rust, no system libraries; also reaches XWayland windows).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
